<svg width="140" height="140" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- pins: top -->
  <g stroke="#ff8a3d" stroke-width="6" stroke-linecap="round">
    <line x1="80" y1="45" x2="80" y2="14"/>
    <line x1="110" y1="45" x2="110" y2="14"/>
    <line x1="130" y1="45" x2="130" y2="14"/>
    <line x1="160" y1="45" x2="160" y2="14"/>

    <!-- pins: bottom -->
    <line x1="80" y1="195" x2="80" y2="226"/>
    <line x1="110" y1="195" x2="110" y2="226"/>
    <line x1="130" y1="195" x2="130" y2="226"/>
    <line x1="160" y1="195" x2="160" y2="226"/>

    <!-- pins: left -->
    <line x1="45" y1="80" x2="14" y2="80"/>
    <line x1="45" y1="110" x2="14" y2="110"/>
    <line x1="45" y1="130" x2="14" y2="130"/>
    <line x1="45" y1="160" x2="14" y2="160"/>

    <!-- pins: right -->
    <line x1="195" y1="80" x2="226" y2="80"/>
    <line x1="195" y1="110" x2="226" y2="110"/>
    <line x1="195" y1="130" x2="226" y2="130"/>
    <line x1="195" y1="160" x2="226" y2="160"/>
  </g>

  <!-- chip body -->
  <rect x="45" y="45" width="150" height="150" rx="14" fill="#1b1f2e" stroke="#ff8a3d" stroke-width="5"/>

  <!-- pin-1 indicator -->
  <circle cx="66" cy="66" r="7" fill="#ff8a3d"/>

  <!-- label -->
  <text x="120" y="132" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="700" fill="#ff8a3d" text-anchor="middle">AVR</text>
</svg>
